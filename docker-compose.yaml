services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_cv_builder
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_cv_builder"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_cv_builder?schema=public
      # Local HTTP deployment: production HTTPS deployments must use secure cookies.
      NODE_ENV: development
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      # An unauthenticated request must reach the running auth guard.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/auth/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      API_INTERNAL_URL: http://api:3001/api
      NEXT_PUBLIC_API_URL: /api
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
